<?xml version="1.0" encoding="UTF-8"?>
<!--
  TEMPLATE: Padrão de entrada Grupo A (média tensão — comercial/industrial)
  Base gráfica pro agente adaptar. Kalebe: refinar contra CELESC N-321.0001 e
  E-321.0031 quando validar em produção. Substituir {VARIAVEIS}.

  Layout A3 paisagem (1587×1123 px @ 96 DPI). 5 zonas:
    - Poste da rede + para-raios + chave seccionadora
    - Cabine primária (13.8 kV) com TC/TP + medidor de faturamento
    - Transformador rebaixador (13.8 kV → 380/220 V)
    - Cabine secundária (BT) com disjuntor geral
    - Carimbo + legenda + notas técnicas
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1587 1123" width="1587" height="1123" font-family="Arial, sans-serif">

  <rect width="1587" height="1123" fill="#ffffff"/>

  <!-- Título -->
  <text x="793" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#0B0F1A">
    PADRÃO DE ENTRADA — GRUPO A — {UNIDADE_CONSUMIDORA}
  </text>
  <text x="793" y="68" text-anchor="middle" font-size="12" fill="#666">
    Conforme CELESC N-321.0001 · Média tensão {TENSAO_PRIMARIA} kV → BT · Demanda {DEMANDA_CONTRATADA} kW
  </text>

  <!-- Poste + para-raios + chave seccionadora -->
  <g id="poste-entrada" transform="translate(120, 160)">
    <line x1="0" y1="0" x2="0" y2="320" stroke="#000" stroke-width="5"/>
    <text x="15" y="20" font-size="11" fill="#0B0F1A" font-weight="700">POSTE ENTRADA</text>
    <text x="15" y="36" font-size="9" fill="#666">CELESC · {NUMERO_POSTE}</text>

    <!-- Para-raios -->
    <g transform="translate(-30, 100)">
      <rect x="-8" y="0" width="16" height="30" fill="#c0392b" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="30" x2="0" y2="60" stroke="#0f766e" stroke-width="2"/>
      <line x1="-14" y1="60" x2="14" y2="60" stroke="#0f766e" stroke-width="2.5"/>
      <text x="20" y="20" font-size="9" fill="#0B0F1A">PARA-RAIOS</text>
      <text x="20" y="32" font-size="8" fill="#666">10 kA · {TENSAO_PARA_RAIOS} kV</text>
    </g>

    <!-- Chave seccionadora -->
    <g transform="translate(30, 200)">
      <line x1="0" y1="0" x2="30" y2="-20" stroke="#000" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
      <circle cx="30" cy="-20" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
      <text x="40" y="0" font-size="10" fill="#0B0F1A" font-weight="700">CHAVE FUSÍVEL</text>
      <text x="40" y="14" font-size="9" fill="#666">3 unipolar · {FUSIVEL_A} A</text>
    </g>
  </g>

  <!-- Ramal primário -->
  <g id="ramal-primario">
    <line x1="120" y1="380" x2="450" y2="380" stroke="#c0392b" stroke-width="3"/>
    <text x="285" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">
      RAMAL PRIMÁRIO · {TENSAO_PRIMARIA} kV
    </text>
    <text x="285" y="400" text-anchor="middle" font-size="10" fill="#666">
      Cabo {BITOLA_PRIMARIA} mm² · {ISOLACAO_PRIMARIA} · {DISTANCIA_PRIMARIO} m
    </text>
  </g>

  <!-- Cabine primária -->
  <g id="cabine-primaria" transform="translate(450, 200)">
    <rect x="0" y="0" width="280" height="360" fill="none" stroke="#000" stroke-width="2"/>
    <text x="140" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0B0F1A">CABINE PRIMÁRIA</text>
    <text x="140" y="40" text-anchor="middle" font-size="10" fill="#666">Medição de faturamento CELESC</text>

    <!-- TC (transformador de corrente) -->
    <g transform="translate(40, 80)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#000" stroke-width="1.5"/>
      <text x="20" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#0B0F1A">TC</text>
      <text x="20" y="55" text-anchor="middle" font-size="8" fill="#666">{TC_RELACAO}</text>
    </g>

    <!-- TP (transformador de potencial) -->
    <g transform="translate(120, 80)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#000" stroke-width="1.5"/>
      <text x="20" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#0B0F1A">TP</text>
      <text x="20" y="55" text-anchor="middle" font-size="8" fill="#666">{TP_RELACAO}</text>
    </g>

    <!-- Medidor multifunção -->
    <g transform="translate(200, 80)">
      <rect x="0" y="0" width="60" height="45" fill="#f4d000" stroke="#000" stroke-width="1.5"/>
      <text x="30" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#0B0F1A">MED</text>
      <text x="30" y="60" text-anchor="middle" font-size="8" fill="#666">Multifunção 4Q</text>
    </g>

    <!-- Disjuntor primário / religador -->
    <g transform="translate(80, 200)">
      <rect x="0" y="0" width="120" height="60" fill="none" stroke="#000" stroke-width="1.5"/>
      <text x="60" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0B0F1A">DJ PRIMÁRIO</text>
      <text x="60" y="42" text-anchor="middle" font-size="9" fill="#666">{DISJUNTOR_PRIMARIO_A} A</text>
      <text x="60" y="55" text-anchor="middle" font-size="8" fill="#666">Curva {CURVA_PRIMARIO}</text>
    </g>
  </g>

  <!-- Transformador rebaixador -->
  <g id="transformador" transform="translate(830, 250)">
    <!-- Símbolo do transformador (2 círculos) -->
    <circle cx="40" cy="60" r="35" fill="none" stroke="#000" stroke-width="2"/>
    <circle cx="100" cy="60" r="35" fill="none" stroke="#000" stroke-width="2"/>
    <text x="40" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#0B0F1A">Δ</text>
    <text x="100" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#0B0F1A">Y</text>

    <text x="70" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#0B0F1A">TRAFO</text>
    <text x="70" y="146" text-anchor="middle" font-size="10" fill="#666">{POTENCIA_TRAFO_KVA} kVA · {TENSAO_PRIMARIA}/{TENSAO_SECUNDARIA}</text>
    <text x="70" y="160" text-anchor="middle" font-size="9" fill="#666">Impedância {IMPEDANCIA_PCT}%</text>
  </g>

  <!-- Cabine secundária / QGBT -->
  <g id="cabine-secundaria" transform="translate(1050, 200)">
    <rect x="0" y="0" width="280" height="360" fill="none" stroke="#000" stroke-width="2"/>
    <text x="140" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0B0F1A">CABINE SECUNDÁRIA · QGBT</text>
    <text x="140" y="40" text-anchor="middle" font-size="10" fill="#666">Baixa tensão · {TENSAO_SECUNDARIA} V</text>

    <!-- Disjuntor geral BT -->
    <g transform="translate(80, 80)">
      <rect x="0" y="0" width="120" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
      <text x="60" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#0B0F1A">DJ GERAL BT</text>
      <text x="60" y="40" text-anchor="middle" font-size="9" fill="#666">{DISJUNTOR_GERAL_BT_A} A</text>
    </g>

    <!-- Barramentos -->
    <line x1="30" y1="180" x2="250" y2="180" stroke="#c0392b" stroke-width="3"/>
    <text x="20" y="184" text-anchor="end" font-size="10" fill="#c0392b" font-weight="700">L1L2L3</text>

    <line x1="30" y1="210" x2="250" y2="210" stroke="#0B0F1A" stroke-width="2"/>
    <text x="20" y="214" text-anchor="end" font-size="10" fill="#0B0F1A">N</text>

    <line x1="30" y1="240" x2="250" y2="240" stroke="#0f766e" stroke-width="2"/>
    <text x="20" y="244" text-anchor="end" font-size="10" fill="#0f766e">PE</text>

    <text x="140" y="300" text-anchor="middle" font-size="10" fill="#666">→ Distribuição interna</text>
  </g>

  <!-- Aterramento -->
  <g id="aterramento" transform="translate(1370, 400)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#0f766e" stroke-width="2"/>
    <line x1="-20" y1="80" x2="20" y2="80" stroke="#0f766e" stroke-width="3"/>
    <line x1="-14" y1="88" x2="14" y2="88" stroke="#0f766e" stroke-width="2"/>
    <line x1="-8" y1="96" x2="8" y2="96" stroke="#0f766e" stroke-width="2"/>
    <text x="25" y="30" font-size="10" fill="#0f766e" font-weight="700">MALHA</text>
    <text x="25" y="45" font-size="9" fill="#666">{N_HASTES}× haste</text>
    <text x="25" y="58" font-size="9" fill="#666">R ≤ 10 Ω</text>
  </g>

  <!-- Rodapé -->
  <g id="rodape" transform="translate(60, 900)">
    <line x1="0" y1="0" x2="1450" y2="0" stroke="#0B0F1A" stroke-width="1"/>

    <!-- Legenda -->
    <text x="0" y="20" font-size="11" font-weight="700" fill="#0B0F1A">LEGENDA</text>
    <text x="0" y="40" font-size="10" fill="#333">TC — Transformador de corrente · TP — Transformador de potencial</text>
    <text x="0" y="56" font-size="10" fill="#333">MED — Medidor multifunção 4 quadrantes · DJ — Disjuntor</text>
    <text x="0" y="72" font-size="10" fill="#333">TRAFO — Transformador rebaixador · QGBT — Quadro geral de baixa tensão</text>

    <!-- Notas -->
    <text x="500" y="20" font-size="11" font-weight="700" fill="#0B0F1A">NOTAS TÉCNICAS</text>
    <text x="500" y="40" font-size="10" fill="#333">1. CELESC N-321.0001 e E-321.0031 · Rev {REV_NORMA}</text>
    <text x="500" y="56" font-size="10" fill="#333">2. Trafo {POTENCIA_TRAFO_KVA} kVA · Impedância {IMPEDANCIA_PCT}%</text>
    <text x="500" y="72" font-size="10" fill="#333">3. Aterramento em malha · R ≤ 10 Ω · {N_HASTES} hastes</text>
    <text x="500" y="88" font-size="10" fill="#333">4. Proteção primária: fusíveis {FUSIVEL_A} A + para-raios</text>
    <text x="500" y="104" font-size="10" fill="#333">5. Cabo primário {BITOLA_PRIMARIA} mm² · isolação {ISOLACAO_PRIMARIA}</text>

    <!-- Carimbo SPIN -->
    <g transform="translate(1120, 0)">
      <rect x="0" y="10" width="320" height="150" fill="none" stroke="#0B0F1A" stroke-width="1.5"/>
      <text x="160" y="35" text-anchor="middle" font-size="13" font-weight="900" fill="#f4d000">SPIN SOLAR</text>
      <text x="160" y="52" text-anchor="middle" font-size="9" fill="#666">{RAZAO_SOCIAL_EMPRESA}</text>
      <text x="160" y="66" text-anchor="middle" font-size="9" fill="#666">CNPJ {CNPJ_EMPRESA}</text>

      <line x1="10" y1="78" x2="310" y2="78" stroke="#333" stroke-width="0.5"/>

      <text x="10" y="98" font-size="10" fill="#333">RT: {RT_NOME}</text>
      <text x="10" y="114" font-size="9" fill="#333">Reg. {RT_CREA} · {RT_TITULO}</text>
      <text x="10" y="128" font-size="9" fill="#333">ART: {ART_NUMERO}</text>

      <text x="10" y="148" font-size="8" fill="#666">Projeto: {CODIGO_PROJETO}</text>
      <text x="160" y="148" font-size="8" fill="#666">Data: {DATA_EMISSAO}</text>
    </g>
  </g>
</svg>
