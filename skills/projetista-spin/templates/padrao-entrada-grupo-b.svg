<?xml version="1.0" encoding="UTF-8"?>
<!--
  TEMPLATE: Padrão de entrada Grupo B (baixa tensão residencial/comercial pequeno)
  Base gráfica pro agente adaptar. Kalebe: refinar contra a norma CELESC I-432.0004
  quando validar em produção. Substituir {VARIAVEIS} pelos dados reais do projeto.

  Layout A4 paisagem (1123×794 px @ 96 DPI). 4 zonas:
    - Topo esquerdo: poste da rede + entrada aérea
    - Centro: medidor + ramal de entrada + QM (quadro de medição)
    - Direita: aterramento (haste + BEP) + carga (QGBT do cliente)
    - Rodapé: carimbo SPIN + legenda + notas técnicas
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1123 794" width="1123" height="794" font-family="Arial, sans-serif">

  <!-- Fundo branco -->
  <rect width="1123" height="794" fill="#ffffff"/>

  <!-- Título -->
  <text x="561" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#0B0F1A">
    PADRÃO DE ENTRADA — GRUPO B — {UNIDADE_CONSUMIDORA}
  </text>
  <text x="561" y="60" text-anchor="middle" font-size="11" fill="#666">
    Conforme CELESC I-432.0004 · Baixa tensão · {POTENCIA_INSTALADA_KW} kW
  </text>

  <!-- Poste da rede -->
  <g id="poste-rede" transform="translate(120, 120)">
    <line x1="0" y1="0" x2="0" y2="240" stroke="#000" stroke-width="4"/>
    <text x="10" y="20" font-size="10" fill="#0B0F1A">POSTE DA REDE</text>
    <text x="10" y="34" font-size="9" fill="#666">CELESC · {NUMERO_POSTE}</text>
    <!-- Cabos da rede aérea -->
    <line x1="-30" y1="80" x2="30" y2="80" stroke="#c0392b" stroke-width="2"/>
    <line x1="-30" y1="95" x2="30" y2="95" stroke="#0f766e" stroke-width="2"/>
  </g>

  <!-- Ramal de entrada (aéreo → medidor) -->
  <g id="ramal-entrada">
    <line x1="120" y1="200" x2="380" y2="200" stroke="#000" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="250" y="192" text-anchor="middle" font-size="10" fill="#0B0F1A">
      RAMAL DE ENTRADA · {BITOLA_CABO} mm² · {ISOLACAO}
    </text>
    <text x="250" y="215" text-anchor="middle" font-size="9" fill="#666">
      Distância: {DISTANCIA_RAMAL_M} m
    </text>
  </g>

  <!-- Quadro de medição (QM) com medidor CELESC -->
  <g id="qm" transform="translate(380, 150)">
    <rect x="0" y="0" width="180" height="180" fill="none" stroke="#000" stroke-width="2"/>
    <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#0B0F1A">QM · QUADRO DE MEDIÇÃO</text>

    <!-- Medidor -->
    <rect x="30" y="45" width="60" height="45" fill="#f4d000" stroke="#000" stroke-width="1.5"/>
    <text x="60" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#0B0F1A">MED</text>
    <text x="60" y="105" text-anchor="middle" font-size="8" fill="#666">CELESC</text>

    <!-- Disjuntor geral -->
    <rect x="105" y="45" width="45" height="45" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="127" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#0B0F1A">DJ</text>
    <text x="127" y="105" text-anchor="middle" font-size="8" fill="#666">{DISJUNTOR_GERAL_A}A</text>

    <!-- BEP -->
    <line x1="60" y1="130" x2="60" y2="160" stroke="#0f766e" stroke-width="2"/>
    <text x="90" y="150" font-size="8" fill="#0f766e">BEP</text>
  </g>

  <!-- Aterramento -->
  <g id="aterramento" transform="translate(680, 200)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#0f766e" stroke-width="2"/>
    <line x1="-20" y1="80" x2="20" y2="80" stroke="#0f766e" stroke-width="3"/>
    <line x1="-14" y1="88" x2="14" y2="88" stroke="#0f766e" stroke-width="2"/>
    <line x1="-8" y1="96" x2="8" y2="96" stroke="#0f766e" stroke-width="2"/>
    <text x="30" y="45" font-size="10" fill="#0f766e" font-weight="700">
      ATERRAMENTO
    </text>
    <text x="30" y="60" font-size="9" fill="#666">
      Haste cobreada 2,4m · {N_HASTES}×
    </text>
    <text x="30" y="74" font-size="9" fill="#666">
      Resistência esperada: ≤ 25 Ω
    </text>
  </g>

  <!-- Ramal de saída pro QGBT do cliente -->
  <g id="ramal-saida">
    <line x1="560" y1="200" x2="900" y2="200" stroke="#000" stroke-width="2"/>
    <text x="730" y="192" text-anchor="middle" font-size="10" fill="#0B0F1A">
      RAMAL DE SAÍDA · {BITOLA_CABO} mm²
    </text>
  </g>

  <!-- QGBT (carga do cliente) -->
  <g id="qgbt" transform="translate(900, 150)">
    <rect x="0" y="0" width="160" height="200" fill="none" stroke="#0B0F1A" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#0B0F1A">QGBT</text>
    <text x="80" y="34" text-anchor="middle" font-size="9" fill="#666">Instalação do cliente</text>

    <!-- Barra L -->
    <line x1="20" y1="60" x2="140" y2="60" stroke="#c0392b" stroke-width="2.5"/>
    <text x="20" y="55" font-size="9" fill="#c0392b">L</text>

    <!-- Barra N -->
    <line x1="20" y1="80" x2="140" y2="80" stroke="#0B0F1A" stroke-width="1.5"/>
    <text x="20" y="75" font-size="9" fill="#0B0F1A">N</text>

    <!-- Barra PE -->
    <line x1="20" y1="100" x2="140" y2="100" stroke="#0f766e" stroke-width="1.5"/>
    <text x="20" y="95" font-size="9" fill="#0f766e">PE</text>

    <text x="80" y="170" text-anchor="middle" font-size="9" fill="#666">Cargas do cliente →</text>
  </g>

  <!-- Rodapé: legenda + notas + carimbo -->
  <g id="rodape" transform="translate(60, 600)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#0B0F1A" stroke-width="1"/>

    <!-- Legenda -->
    <text x="0" y="20" font-size="10" font-weight="700" fill="#0B0F1A">LEGENDA</text>
    <text x="0" y="38" font-size="9" fill="#333">MED — Medidor bidirecional CELESC</text>
    <text x="0" y="52" font-size="9" fill="#333">DJ — Disjuntor geral</text>
    <text x="0" y="66" font-size="9" fill="#333">BEP — Barramento equipotencial principal</text>
    <text x="0" y="80" font-size="9" fill="#333">QGBT — Quadro geral de baixa tensão</text>

    <!-- Notas -->
    <text x="360" y="20" font-size="10" font-weight="700" fill="#0B0F1A">NOTAS TÉCNICAS</text>
    <text x="360" y="38" font-size="9" fill="#333">1. Instalação conforme CELESC I-432.0004 · Rev {REV_NORMA}</text>
    <text x="360" y="52" font-size="9" fill="#333">2. Aterramento com haste cobreada 2,4 m · resistência ≤ 25 Ω</text>
    <text x="360" y="66" font-size="9" fill="#333">3. Ramal em cabo {BITOLA_CABO} mm² · isolação {ISOLACAO}</text>
    <text x="360" y="80" font-size="9" fill="#333">4. Disjuntor geral {DISJUNTOR_GERAL_A} A · curva {CURVA_DISJUNTOR}</text>

    <!-- Carimbo SPIN -->
    <g transform="translate(760, 0)">
      <rect x="0" y="10" width="240" height="130" fill="none" stroke="#0B0F1A" stroke-width="1"/>
      <text x="120" y="30" text-anchor="middle" font-size="11" font-weight="900" fill="#f4d000">SPIN SOLAR</text>
      <text x="120" y="46" text-anchor="middle" font-size="8" fill="#666">{RAZAO_SOCIAL_EMPRESA}</text>
      <text x="120" y="60" text-anchor="middle" font-size="8" fill="#666">CNPJ {CNPJ_EMPRESA}</text>

      <line x1="10" y1="72" x2="230" y2="72" stroke="#333" stroke-width="0.5"/>

      <text x="10" y="88" font-size="8" fill="#333">RT: {RT_NOME}</text>
      <text x="10" y="100" font-size="8" fill="#333">Reg. {RT_CREA} · {RT_TITULO}</text>
      <text x="10" y="112" font-size="8" fill="#333">ART: {ART_NUMERO}</text>

      <text x="10" y="130" font-size="7" fill="#666">Projeto: {CODIGO_PROJETO}</text>
      <text x="120" y="130" font-size="7" fill="#666">Data: {DATA_EMISSAO}</text>
    </g>
  </g>
</svg>
