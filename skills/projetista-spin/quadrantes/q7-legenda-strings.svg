<?xml version="1.0" encoding="UTF-8"?>
<!--
  QUADRANTE 7 — LEGENDA DAS STRINGS
  Referência: imagem enviada por Kalebe em 2026-07-28
  Elementos:
    - Título fora da moldura (topo)
    - Moldura tracejada
    - 2 colunas: MPPT 01 e MPPT 02 (títulos em azul)
    - Cada MPPT tem uma STRING (bullet + texto vermelho)
    - 4 linhas de dados por string (preto): Quant. módulos / Tensão Vmp / Corrente Imp / Potência total
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260">
  <rect x="0" y="0" width="720" height="260" fill="#FFFFFF"/>

  <!-- ═══ TÍTULO (fora da moldura, canto superior esquerdo) ═══ -->
  <text x="30" y="35" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111827">MICROINVERSORES DE 01 A 07</text>

  <!-- ═══ MOLDURA TRACEJADA envolvente ═══ -->
  <rect x="30" y="55" width="660" height="180" fill="none" stroke="#111827" stroke-width="0.8" stroke-dasharray="5,4"/>

  <!-- ═══════════ COLUNA MPPT 01 (esquerda) ═══════════ -->
  <text x="50" y="85" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a4f8b">MPPT 01</text>

  <!-- Bullet vermelho + STRING 01 -->
  <circle cx="78" cy="107" r="3.5" fill="#c0392b"/>
  <text x="90" y="112" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">STRING 01</text>

  <!-- Dados da string 01 (MPPT 01) -->
  <text x="90" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827">Quant. de módulos: 01 unidade</text>
  <text x="90" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827">Tensão (Vmp): 41,96 * 1 = 41,96V</text>
  <text x="90" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827">Corrente (Imp): 13,11A</text>
  <text x="90" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827">Potência total: 550Wp * 1 = 550Wp</text>


  <!-- ═══════════ COLUNA MPPT 02 (direita) ═══════════ -->
  <text x="380" y="85" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a4f8b">MPPT 02</text>

  <!-- Bullet vermelho + STRING 01 -->
  <circle cx="408" cy="107" r="3.5" fill="#c0392b"/>
  <text x="420" y="112" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">STRING 01</text>

  <!-- Dados da string 01 (MPPT 02) -->
  <text x="420" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827">Quant. de módulos: 01 unidade</text>
  <text x="420" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827">Tensão (Vmp): 41,96 * 1 = 41,96V</text>
  <text x="420" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827">Corrente (Imp): 13,11A</text>
  <text x="420" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827">Potência total: 550Wp * 1 = 550Wp</text>
</svg>
