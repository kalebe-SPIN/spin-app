<?xml version="1.0" encoding="UTF-8"?>
<!--
  QUADRANTE 4 v2 — QUADRO DE DISTRIBUIÇÃO (QDC)
  Referência: imagem enviada por Kalebe em 2026-07-28 + feedback pra aproximar mais
  Regra: textos NÃO devem sobrepor linhas; só QDC (sem outros quadros)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <rect x="0" y="0" width="900" height="340" fill="#FFFFFF"/>

  <!-- ═══ CABO DE ENTRADA (topo) ═══ -->
  <text x="380" y="20" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#111827">3#10(10)+T10mm²</text>
  <line x1="380" y1="28" x2="380" y2="70" stroke="#111827" stroke-width="1.2"/>

  <!-- ═══ MOLDURA TRACEJADA — QUADRO DE DISTRIBUIÇÃO ═══ -->
  <rect x="50" y="60" width="810" height="255" fill="none" stroke="#111827" stroke-width="0.7" stroke-dasharray="5,4"/>

  <!-- Título "QUADRO DE DISTRIBUIÇÃO" (canto superior direito) -->
  <text x="835" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#111827">QUADRO DE</text>
  <text x="835" y="107" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#111827">DISTRIBUIÇÃO</text>

  <!-- ═══ LABEL do DISJUNTOR (afastado das linhas) ═══ -->
  <text x="315" y="90" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#111827">Tripolar</text>
  <text x="315" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#111827">50A</text>

  <!-- ═══ DISJUNTOR TRIPOLAR 50A ═══ -->
  <g transform="translate(380, 100)">
    <!-- 3 traços verticais entrando -->
    <line x1="-10" y1="-30" x2="-10" y2="-14" stroke="#111827" stroke-width="1"/>
    <line x1="0" y1="-30" x2="0" y2="-14" stroke="#111827" stroke-width="1"/>
    <line x1="10" y1="-30" x2="10" y2="-14" stroke="#111827" stroke-width="1"/>
    <!-- Contatos superiores -->
    <circle cx="-10" cy="-14" r="1.6" fill="#111827"/>
    <circle cx="0" cy="-14" r="1.6" fill="#111827"/>
    <circle cx="10" cy="-14" r="1.6" fill="#111827"/>
    <!-- Chaves inclinadas (interruptores tripolar) -->
    <line x1="-10" y1="-14" x2="-3" y2="6" stroke="#111827" stroke-width="1.4"/>
    <line x1="0" y1="-14" x2="7" y2="6" stroke="#111827" stroke-width="1.4"/>
    <line x1="10" y1="-14" x2="17" y2="6" stroke="#111827" stroke-width="1.4"/>
    <!-- Linha tracejada horizontal (mecanismo comum tripolar) -->
    <line x1="-3" y1="-1" x2="17" y2="-1" stroke="#111827" stroke-width="0.6" stroke-dasharray="2,2"/>
    <!-- Contatos inferiores -->
    <circle cx="-10" cy="8" r="1.6" fill="#111827"/>
    <circle cx="0" cy="8" r="1.6" fill="#111827"/>
    <circle cx="10" cy="8" r="1.6" fill="#111827"/>
    <!-- 3 traços verticais saindo -->
    <line x1="-10" y1="8" x2="-10" y2="30" stroke="#111827" stroke-width="1"/>
    <line x1="0" y1="8" x2="0" y2="30" stroke="#111827" stroke-width="1"/>
    <line x1="10" y1="8" x2="10" y2="30" stroke="#111827" stroke-width="1"/>
  </g>

  <!-- Linha até o barramento (junta as 3 fases num só ponto) -->
  <line x1="380" y1="130" x2="380" y2="180" stroke="#111827" stroke-width="1.2"/>

  <!-- ═══ DPS CA (à esquerda, com specs em coluna) ═══ -->
  <!-- Labels do DPS bem afastados -->
  <text x="140" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#111827">DPS CA</text>
  <text x="140" y="165" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111827">Classe II</text>
  <text x="140" y="178" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111827">In: 10kA</text>
  <text x="140" y="191" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111827">Imax: 20kA</text>
  <text x="140" y="204" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#111827">275V</text>

  <!-- Aterramento verde do DPS (à esquerda do corpo) -->
  <g transform="translate(155, 180)">
    <!-- Símbolo aterramento -->
    <line x1="0" y1="-4" x2="0" y2="0" stroke="#1e8449" stroke-width="1.4"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#1e8449" stroke-width="1.7"/>
    <line x1="-5" y1="3" x2="5" y2="3" stroke="#1e8449" stroke-width="1.7"/>
    <line x1="-3" y1="6" x2="3" y2="6" stroke="#1e8449" stroke-width="1.7"/>
    <!-- Linha verde subindo até o DPS -->
    <line x1="0" y1="-4" x2="18" y2="-4" stroke="#1e8449" stroke-width="1.4"/>
  </g>

  <!-- Corpo do DPS CA (caixinha com diagonal) -->
  <g transform="translate(180, 180)">
    <rect x="-8" y="-11" width="16" height="22" fill="#FFFFFF" stroke="#111827" stroke-width="1.1"/>
    <line x1="-8" y1="11" x2="8" y2="-11" stroke="#111827" stroke-width="1"/>
  </g>

  <!-- Linha horizontal DPS → barramento -->
  <line x1="188" y1="180" x2="380" y2="180" stroke="#111827" stroke-width="1.1"/>

  <!-- ═══ BARRAMENTO HORIZONTAL ═══ -->
  <line x1="150" y1="180" x2="820" y2="180" stroke="#111827" stroke-width="3"/>

  <!-- ═══ SAÍDA PRA CARGAS (à esquerda) — 3 setas descendo ═══ -->
  <g transform="translate(210, 180)">
    <line x1="-15" y1="0" x2="-15" y2="55" stroke="#111827" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="55" stroke="#111827" stroke-width="1"/>
    <line x1="15" y1="0" x2="15" y2="55" stroke="#111827" stroke-width="1"/>
    <!-- Setas -->
    <path d="M -15 55 l -3.5 -6 l 7 0 z" fill="#111827"/>
    <path d="M 0 55 l -3.5 -6 l 7 0 z" fill="#111827"/>
    <path d="M 15 55 l -3.5 -6 l 7 0 z" fill="#111827"/>
  </g>
  <text x="210" y="272" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Cargas</text>

  <!-- ═══ SAÍDAS PRO QUADRO DE PROTEÇÃO CA (2 cabos à direita) ═══ -->
  <!-- Cabo 1 -->
  <line x1="500" y1="180" x2="500" y2="300" stroke="#111827" stroke-width="1"/>
  <text x="516" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">1#4(4)+T4mm²</text>

  <!-- Cabo 2 -->
  <line x1="680" y1="180" x2="680" y2="300" stroke="#111827" stroke-width="1"/>
  <text x="696" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">1#4(4)+T4mm²</text>

  <!-- ═══ ATERRAMENTO VERDE geral (à direita do barramento) ═══ -->
  <line x1="820" y1="180" x2="820" y2="235" stroke="#1e8449" stroke-width="1.4"/>
  <g transform="translate(820, 240)">
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#1e8449" stroke-width="1.8"/>
    <line x1="-7" y1="3" x2="7" y2="3" stroke="#1e8449" stroke-width="1.8"/>
    <line x1="-4" y1="6" x2="4" y2="6" stroke="#1e8449" stroke-width="1.8"/>
  </g>
</svg>
