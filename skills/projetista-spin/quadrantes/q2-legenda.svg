<?xml version="1.0" encoding="UTF-8"?>
<!--
  QUADRANTE 2 — LEGENDA oficial SPIN
  Referência: imagem enviada por Kalebe em 2026-07-28
  Estilo: tabela 2 colunas × 8 símbolos, cada símbolo em sua própria caixa
  Todo o bloco tem moldura externa fina
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620">
  <rect x="0" y="0" width="320" height="620" fill="#FFFFFF"/>

  <!-- MOLDURA EXTERNA -->
  <rect x="10" y="10" width="300" height="600" fill="none" stroke="#111827" stroke-width="1"/>

  <!-- ═══ CABEÇALHO "LEGENDA" ═══ -->
  <rect x="10" y="10" width="300" height="30" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
  <text x="160" y="30" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">LEGENDA</text>

  <!-- ═════════════ TABELA 2 COLUNAS × 8 LINHAS ═════════════ -->
  <!-- Coluna símbolo: 10..130 (largura 120) -->
  <!-- Coluna descrição: 130..310 (largura 180) -->
  <line x1="130" y1="40" x2="130" y2="610" stroke="#111827" stroke-width="1"/>

  <!-- ▬▬▬ ROW 1 (y=40..110): Disjuntor termomagnético ▬▬▬ -->
  <line x1="10" y1="110" x2="310" y2="110" stroke="#111827" stroke-width="1"/>
  <g transform="translate(70, 75)">
    <!-- Disjuntor bipolar com aterramento -->
    <line x1="-14" y1="-20" x2="-14" y2="-8" stroke="#111827" stroke-width="1"/>
    <line x1="0" y1="-20" x2="0" y2="-8" stroke="#111827" stroke-width="1"/>
    <circle cx="-14" cy="-8" r="1.5" fill="#111827"/>
    <circle cx="0" cy="-8" r="1.5" fill="#111827"/>
    <!-- Chaves inclinadas (interruptores) -->
    <line x1="-14" y1="-8" x2="-5" y2="5" stroke="#111827" stroke-width="1.2"/>
    <line x1="0" y1="-8" x2="9" y2="5" stroke="#111827" stroke-width="1.2"/>
    <!-- Linha tracejada conectando (mecanismo comum bipolar) -->
    <line x1="-5" y1="0" x2="4" y2="0" stroke="#111827" stroke-width="0.5" stroke-dasharray="1.5,1.5"/>
    <circle cx="-14" cy="7" r="1.5" fill="#111827"/>
    <circle cx="0" cy="7" r="1.5" fill="#111827"/>
    <line x1="-14" y1="7" x2="-14" y2="18" stroke="#111827" stroke-width="1"/>
    <line x1="0" y1="7" x2="0" y2="18" stroke="#111827" stroke-width="1"/>
    <!-- Aterramento -->
    <line x1="-7" y1="18" x2="-7" y2="22" stroke="#111827" stroke-width="1"/>
    <g transform="translate(-7, 22)">
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#111827" stroke-width="1.2"/>
      <line x1="-3" y1="2" x2="3" y2="2" stroke="#111827" stroke-width="1.2"/>
      <line x1="-1.5" y1="4" x2="1.5" y2="4" stroke="#111827" stroke-width="1.2"/>
    </g>
  </g>
  <text x="145" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Disjuntor termomagnético</text>

  <!-- ▬▬▬ ROW 2 (y=110..180): Medidor de energia kWh ▬▬▬ -->
  <line x1="10" y1="180" x2="310" y2="180" stroke="#111827" stroke-width="1"/>
  <g transform="translate(70, 145)">
    <!-- Caixa do medidor -->
    <rect x="-22" y="-12" width="44" height="24" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
    <!-- Setas bidirecionais NO TOPO -->
    <line x1="-14" y1="-6" x2="14" y2="-6" stroke="#111827" stroke-width="0.8"/>
    <path d="M -14 -6 l 3 -2 M -14 -6 l 3 2" fill="none" stroke="#111827" stroke-width="0.8"/>
    <path d="M 14 -6 l -3 -2 M 14 -6 l -3 2" fill="none" stroke="#111827" stroke-width="0.8"/>
    <!-- Texto KWH -->
    <text x="0" y="8" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#111827">KWH</text>
  </g>
  <text x="145" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Medidor de energia kWh</text>

  <!-- ▬▬▬ ROW 3 (y=180..250): DPS CC / CA ▬▬▬ -->
  <line x1="10" y1="250" x2="310" y2="250" stroke="#111827" stroke-width="1"/>
  <g transform="translate(70, 215)">
    <!-- Seta indicando surto (à esquerda) apontando pra caixa -->
    <line x1="-25" y1="0" x2="-12" y2="0" stroke="#111827" stroke-width="1"/>
    <path d="M -25 0 l 3 -2 l 0 4 z" fill="#111827"/>
    <!-- Caixa DPS -->
    <rect x="-12" y="-10" width="24" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
    <!-- Diagonal interna -->
    <line x1="-12" y1="10" x2="12" y2="-10" stroke="#111827" stroke-width="1"/>
    <!-- Descida ao terra -->
    <line x1="0" y1="10" x2="0" y2="18" stroke="#111827" stroke-width="1"/>
    <g transform="translate(0, 20)">
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#111827" stroke-width="1.2"/>
      <line x1="-2.5" y1="2" x2="2.5" y2="2" stroke="#111827" stroke-width="1.2"/>
      <line x1="-1" y1="4" x2="1" y2="4" stroke="#111827" stroke-width="1.2"/>
    </g>
  </g>
  <text x="145" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">DPS CC / CA</text>

  <!-- ▬▬▬ ROW 4 (y=250..320): Fusível CC ▬▬▬ -->
  <line x1="10" y1="320" x2="310" y2="320" stroke="#111827" stroke-width="1"/>
  <g transform="translate(70, 285)">
    <!-- Traço superior -->
    <line x1="0" y1="-20" x2="0" y2="-12" stroke="#111827" stroke-width="1"/>
    <!-- Corpo do fusível (retângulo vertical estreito) -->
    <rect x="-4" y="-12" width="8" height="24" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
    <!-- Traço interno (elemento fusível) -->
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#111827" stroke-width="0.9"/>
    <!-- Traço inferior -->
    <line x1="0" y1="12" x2="0" y2="20" stroke="#111827" stroke-width="1"/>
  </g>
  <text x="145" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Fusível CC</text>

  <!-- ▬▬▬ ROW 5 (y=320..380): Barramento ▬▬▬ -->
  <line x1="10" y1="380" x2="310" y2="380" stroke="#111827" stroke-width="1"/>
  <line x1="35" y1="350" x2="105" y2="350" stroke="#111827" stroke-width="2.5"/>
  <text x="145" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Barramento</text>

  <!-- ▬▬▬ ROW 6 (y=380..450): Transformador / Autotransformador ▬▬▬ -->
  <line x1="10" y1="450" x2="310" y2="450" stroke="#111827" stroke-width="1"/>
  <g transform="translate(70, 415)">
    <!-- 2 círculos entrelaçados horizontais -->
    <circle cx="-8" cy="0" r="10" fill="none" stroke="#111827" stroke-width="1.2"/>
    <circle cx="8" cy="0" r="10" fill="none" stroke="#111827" stroke-width="1.2"/>
  </g>
  <text x="145" y="410" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Transformador /</text>
  <text x="145" y="425" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Autotransformador</text>

  <!-- ▬▬▬ ROW 7 (y=450..520): Inversor / Microinversor ▬▬▬ -->
  <line x1="10" y1="520" x2="310" y2="520" stroke="#111827" stroke-width="1"/>
  <g transform="translate(70, 485)">
    <!-- Retângulo -->
    <rect x="-22" y="-12" width="44" height="24" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
    <!-- Diagonal separando CC/CA -->
    <line x1="-22" y1="12" x2="22" y2="-12" stroke="#111827" stroke-width="1"/>
    <!-- Onda senoidal (~) no canto superior esquerdo -->
    <path d="M -18 -3 q 3 -6 6 0 t 6 0" fill="none" stroke="#111827" stroke-width="1.1"/>
    <!-- Traços paralelos (=) no canto inferior direito -->
    <line x1="7" y1="4" x2="17" y2="4" stroke="#111827" stroke-width="1"/>
    <line x1="7" y1="8" x2="17" y2="8" stroke="#111827" stroke-width="1"/>
  </g>
  <text x="145" y="480" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Inversor /</text>
  <text x="145" y="495" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Microinversor</text>

  <!-- ▬▬▬ ROW 8 (y=520..610): Módulo fotovoltaico ▬▬▬ -->
  <g transform="translate(70, 560)">
    <!-- Retângulo -->
    <rect x="-24" y="-14" width="48" height="28" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
    <!-- Triângulo/seta interna (indicando célula) -->
    <polygon points="-14,8 8,8 -14,-8" fill="#111827"/>
  </g>
  <text x="145" y="565" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Módulo fotovoltaico</text>
</svg>
