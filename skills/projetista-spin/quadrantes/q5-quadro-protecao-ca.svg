<?xml version="1.0" encoding="UTF-8"?>
<!--
  QUADRANTE 5 — QUADRO DE PROTEÇÃO CA (QPCA)
  Referência: imagem enviada por Kalebe em 2026-07-28
  Elementos:
    - Moldura tracejada com título no canto superior direito
    - 2 entradas verticais (vindas do QDC) com bitola 1#4(4)+T4mm²
    - DPS CA principal (com specs) à esquerda + aterramento verde
    - DPS CA secundário (só símbolo compacto) no meio + aterramento verde
    - 2 Disjuntores Monopolares 20A (um em cada linha)
    - 2 saídas pra baixo com bitola 1#4(4)+T4mm² (rumo aos inversores)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <rect x="0" y="0" width="900" height="340" fill="#FFFFFF"/>

  <!-- ═══ ENTRADAS (topo) — vindas do QDC ═══ -->
  <text x="410" y="18" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#111827">1#4(4)+T4mm²</text>
  <line x1="410" y1="26" x2="410" y2="60" stroke="#111827" stroke-width="1"/>

  <text x="620" y="18" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#111827">1#4(4)+T4mm²</text>
  <line x1="620" y1="26" x2="620" y2="60" stroke="#111827" stroke-width="1"/>

  <!-- ═══ MOLDURA TRACEJADA — QUADRO DE PROTEÇÃO CA ═══ -->
  <rect x="220" y="55" width="640" height="215" fill="none" stroke="#111827" stroke-width="0.7" stroke-dasharray="5,4"/>

  <!-- Título "QUADRO DE PROTEÇÃO CA" (canto superior direito) -->
  <text x="835" y="85" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#111827">QUADRO DE</text>
  <text x="835" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#111827">PROTEÇÃO CA</text>

  <!-- ═══ RAMO 1 — DPS CA principal + Monopolar 20A ═══ -->

  <!-- Barra horizontal ligando DPS ao ramo 1 -->
  <line x1="330" y1="95" x2="410" y2="95" stroke="#111827" stroke-width="1"/>

  <!-- Aterramento verde do DPS 1 (à esquerda) -->
  <g transform="translate(285, 95)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#1e8449" stroke-width="1.4"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#1e8449" stroke-width="1.7"/>
    <line x1="-5" y1="3" x2="5" y2="3" stroke="#1e8449" stroke-width="1.7"/>
    <line x1="-3" y1="6" x2="3" y2="6" stroke="#1e8449" stroke-width="1.7"/>
  </g>

  <!-- Corpo do DPS CA principal -->
  <g transform="translate(315, 95)">
    <rect x="-8" y="-10" width="16" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
    <line x1="-8" y1="10" x2="8" y2="-10" stroke="#111827" stroke-width="1"/>
  </g>

  <!-- Labels do DPS principal (à esquerda, longe das linhas) -->
  <text x="280" y="140" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">DPS CA</text>
  <text x="280" y="155" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#111827">Classe II</text>
  <text x="280" y="168" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#111827">In: 10kA</text>
  <text x="280" y="181" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#111827">Imax: 20kA</text>
  <text x="280" y="194" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#111827">275V</text>

  <!-- Linha vertical do ramo 1 -->
  <line x1="410" y1="60" x2="410" y2="140" stroke="#111827" stroke-width="1"/>

  <!-- Disjuntor Monopolar 20A do ramo 1 -->
  <g transform="translate(410, 155)">
    <line x1="0" y1="-15" x2="0" y2="-5" stroke="#111827" stroke-width="1"/>
    <circle cx="0" cy="-5" r="1.6" fill="#111827"/>
    <line x1="0" y1="-5" x2="10" y2="8" stroke="#111827" stroke-width="1.4"/>
    <circle cx="0" cy="10" r="1.6" fill="#111827"/>
    <line x1="0" y1="10" x2="0" y2="20" stroke="#111827" stroke-width="1"/>
  </g>

  <!-- Label do disjuntor 1 (à direita, com folga) -->
  <text x="437" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827">Monopolar</text>
  <text x="437" y="164" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827">20A</text>

  <!-- Continua a linha até fim do quadro -->
  <line x1="410" y1="175" x2="410" y2="270" stroke="#111827" stroke-width="1"/>

  <!-- ═══ RAMO 2 — DPS CA secundário (compacto) + Monopolar 20A ═══ -->

  <!-- Barra horizontal ligando DPS ao ramo 2 -->
  <line x1="545" y1="95" x2="620" y2="95" stroke="#111827" stroke-width="1"/>

  <!-- Aterramento verde do DPS 2 (à esquerda) -->
  <g transform="translate(500, 95)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#1e8449" stroke-width="1.4"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#1e8449" stroke-width="1.7"/>
    <line x1="-4" y1="3" x2="4" y2="3" stroke="#1e8449" stroke-width="1.7"/>
    <line x1="-2" y1="6" x2="2" y2="6" stroke="#1e8449" stroke-width="1.7"/>
  </g>

  <!-- Corpo do DPS CA secundário (compacto, sem labels) -->
  <g transform="translate(530, 95)">
    <rect x="-8" y="-10" width="16" height="20" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
    <line x1="-8" y1="10" x2="8" y2="-10" stroke="#111827" stroke-width="1"/>
  </g>

  <!-- Linha vertical do ramo 2 -->
  <line x1="620" y1="60" x2="620" y2="140" stroke="#111827" stroke-width="1"/>

  <!-- Disjuntor Monopolar 20A do ramo 2 -->
  <g transform="translate(620, 155)">
    <line x1="0" y1="-15" x2="0" y2="-5" stroke="#111827" stroke-width="1"/>
    <circle cx="0" cy="-5" r="1.6" fill="#111827"/>
    <line x1="0" y1="-5" x2="10" y2="8" stroke="#111827" stroke-width="1.4"/>
    <circle cx="0" cy="10" r="1.6" fill="#111827"/>
    <line x1="0" y1="10" x2="0" y2="20" stroke="#111827" stroke-width="1"/>
  </g>

  <!-- Label do disjuntor 2 (à direita) -->
  <text x="647" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111827">Monopolar</text>
  <text x="647" y="164" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827">20A</text>

  <!-- Continua a linha até fim do quadro -->
  <line x1="620" y1="175" x2="620" y2="270" stroke="#111827" stroke-width="1"/>

  <!-- ═══ SAÍDAS (embaixo) — pra baixo, indo aos inversores ═══ -->
  <line x1="410" y1="270" x2="410" y2="310" stroke="#111827" stroke-width="1"/>
  <text x="454" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">1#4(4)+T4mm²</text>

  <line x1="620" y1="270" x2="620" y2="310" stroke="#111827" stroke-width="1"/>
  <text x="664" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">1#4(4)+T4mm²</text>
</svg>
