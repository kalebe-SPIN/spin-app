<?xml version="1.0" encoding="UTF-8"?>
<!--
  QUADRANTE 6 protótipo v7 — correções Kalebe:
    - Cabos dos MPPTs alinhados COM o corpo do microinversor (saem de dentro dele)
    - Placas não sobrepõem informações (dados na altura correta dos módulos)
    - Distância natural das escritas MPPT (12px, não muito próximo nem muito longe)
    - Inversor mais largo pra acomodar as 2 saídas alinhadas
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330">
  <rect x="0" y="0" width="460" height="330" fill="#FFFFFF"/>

  <!-- ═══ BARRAMENTO CA (topo) ═══ -->
  <text x="70" y="18" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">1#4(4)+T4mm²</text>
  <line x1="30" y1="30" x2="430" y2="30" stroke="#111827" stroke-width="1.1"/>

  <!-- Descida do barramento até o topo do inversor -->
  <line x1="100" y1="30" x2="100" y2="65" stroke="#111827" stroke-width="1"/>

  <!-- ═══ MICROINVERSOR (mais largo pra abrigar as 2 saídas) ═══ -->
  <g transform="translate(100, 90)">
    <rect x="-30" y="-25" width="60" height="50" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
    <line x1="-30" y1="25" x2="30" y2="-25" stroke="#111827" stroke-width="0.8"/>
    <path d="M -22 -12 q 4 -8 8 0 t 8 0" fill="none" stroke="#111827" stroke-width="1"/>
    <line x1="6" y1="8" x2="24" y2="8" stroke="#111827" stroke-width="0.9"/>
    <line x1="6" y1="14" x2="24" y2="14" stroke="#111827" stroke-width="0.9"/>
  </g>

  <!-- ═══ DADOS TÉCNICOS INVERSOR (à direita, mesma altura) ═══ -->
  <text x="155" y="72" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Marca: WEG</text>
  <text x="155" y="87" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Modelo: SIW 100 M010 W00</text>
  <text x="155" y="102" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Tensão CA: 220V</text>
  <text x="155" y="117" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Corrente CA: 4,54A</text>

  <!-- ═══ MPPTs — saem de DENTRO do inversor, alinhados ═══ -->

  <!-- MPPT 1 (x=80, dentro da esquerda do inversor) -->
  <line x1="80" y1="115" x2="80" y2="220" stroke="#111827" stroke-width="1"/>
  <text x="68" y="165" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#111827" transform="rotate(-90 68 165)">MPPT 1</text>

  <!-- MPPT 2 (x=120, dentro da direita do inversor) -->
  <line x1="120" y1="115" x2="120" y2="220" stroke="#111827" stroke-width="1"/>
  <text x="132" y="165" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#111827" transform="rotate(-90 132 165)">MPPT 2</text>

  <!-- ═══ DADOS DOS CABOS CC (à direita, na altura das linhas MPPTs) ═══ -->
  <text x="155" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">4mm² Positivo</text>
  <text x="155" y="165" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">4mm² Negativo</text>
  <text x="155" y="180" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">4mm² Proteção</text>

  <!-- ═══ MÓDULOS (retângulo + triângulo preto interno, padrão da legenda Q2) ═══ -->

  <!-- Módulo 1 (alinhado com MPPT 1 em x=80) — largura 30, gap com MPPT ok -->
  <g transform="translate(80, 235)">
    <rect x="-16" y="-11" width="32" height="22" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
    <polygon points="-9,5 5,5 -9,-5" fill="#111827"/>
  </g>

  <!-- Módulo 2 (alinhado com MPPT 2 em x=120) -->
  <g transform="translate(120, 235)">
    <rect x="-16" y="-11" width="32" height="22" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
    <polygon points="-9,5 5,5 -9,-5" fill="#111827"/>
  </g>

  <!-- Base horizontal conectando os dois módulos (traço fino embaixo) -->
  <line x1="64" y1="252" x2="136" y2="252" stroke="#111827" stroke-width="0.9"/>

  <!-- ═══ ATERRAMENTO VERDE (à esquerda) ═══ -->
  <line x1="64" y1="252" x2="45" y2="252" stroke="#1e8449" stroke-width="1.3"/>
  <line x1="45" y1="252" x2="45" y2="263" stroke="#1e8449" stroke-width="1.3"/>
  <g transform="translate(45, 266)">
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#1e8449" stroke-width="1.5"/>
    <line x1="-4" y1="2.5" x2="4" y2="2.5" stroke="#1e8449" stroke-width="1.5"/>
    <line x1="-2" y1="5" x2="2" y2="5" stroke="#1e8449" stroke-width="1.5"/>
  </g>

  <!-- ═══ DADOS DOS MÓDULOS (à direita, NA ALTURA DOS MÓDULOS — sem sobreposição) ═══ -->
  <text x="155" y="215" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Módulos fotovoltaicos</text>
  <text x="155" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Marca: WEG</text>
  <text x="155" y="245" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Modelo: WPV550-555HMM3-550W</text>
  <text x="155" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Tensão CC (Vmp): 41,96V</text>
  <text x="155" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Corrente CC (Imp): 13,11A</text>

  <!-- ═══ POTÊNCIA TOTAL (embaixo à esquerda, texto simples) ═══ -->
  <text x="45" y="298" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">Potência total:</text>
  <text x="45" y="313" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111827">2 * 550Wp = 1.100Wp</text>
</svg>
